services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: atlas
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 10

  nats:
    image: nats:2.10
    ports:
      - "4222:4222"

  # 一次性初始化：将快照卷 /backups 的属主改为 ES 进程 uid(1000):gid(0)，
  # 否则 ES 以 elasticsearch 用户运行对 root 所有的命名卷无写权限，
  # 导致快照创建成功却不落盘（register repo 500 / 快照为空）。
  es-init:
    image: busybox:1.36
    user: "0:0"
    command: ["sh", "-c", "chown -R 1000:0 /backups && chmod 750 /backups && echo es-backup chowned"]
    volumes:
      - es_backup:/backups
    restart: "no"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    depends_on:
      es-init:
        condition: service_completed_successfully
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es_backup:/backups
      - ./configs/elasticsearch.yml:/usr/share/elasticsearch/config/elasticsearch.yml:ro
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  atlas:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      ATLAS_PG_DSN: "postgres://postgres:postgres@postgres:5432/atlas?sslmode=disable"
      ATLAS_NATS_URL: "nats://nats:4222"
      ATLAS_ES_ADDR: "http://elasticsearch:9200"
    ports:
      - "8080:8080"

  # 第二个实例，共享同一 NATS/PG/ES，演示横向扩展（队列组负载均衡）
  atlas2:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
      nats:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    environment:
      ATLAS_PG_DSN: "postgres://postgres:postgres@postgres:5432/atlas?sslmode=disable"
      ATLAS_NATS_URL: "nats://nats:4222"
      ATLAS_ES_ADDR: "http://elasticsearch:9200"
      ATLAS_HTTP_ADDR: ":8081"
    ports:
      - "8081:8081"

volumes:
  pgdata:
  es_backup:
